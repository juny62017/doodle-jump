<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Doodle Jump</title>
    <link rel="icon" href="https://cdn.hackclub.com/019f99c4-31b2-7805-932e-a81c8fe69654/dddd.png" />
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@600;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="game-wrapper">
      <div class="game-ui">
        <span class="score-label">Score</span>
        <span id="scoreEl" class="score-value">0</span>
        <span class="high-score-label">Best</span>
        <span id="highScoreEl" class="high-score-value">0</span>
      </div>
      <canvas id="gameCanvas" width="480" height="600"></canvas>
    </div>
    <script src="script.js"></script>
  </body>
</html>
